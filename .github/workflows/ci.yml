name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  # A tag push does not test again: the tagged commit was tested when it was
  # pushed to main, and the release job requires that run's success (below).
  test:
    name: Vet & Test
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache: true
      - name: Download dependencies
        run: go mod download
      # Formatting guard: gofmt is OS-invariant, Linux-only is enough.
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      # -race is load-bearing, not optional: the driver fans sub-agents out
      # across goroutines and the tools package fetches in parallel. Only the
      # race detector sees that class of bug.
      - name: Test
        run: go test -race ./...
      # Every released platform must compile. The terminal UI is split across
      # //go:build unix and !unix files, and the unix half once used Linux-only
      # ioctl request constants — so `go build` on Linux stayed green while
      # every macOS build failed. A compile-only bug has no unit test; this
      # step is its regression test.
      - name: Cross-compile release targets
        run: |
          for pair in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 \
                      windows/amd64 windows/arm64; do
            echo "building ${pair}"
            GOOS=${pair%/*} GOARCH=${pair#*/} go build -o /dev/null ./... || exit 1
          done
      # Building is not testing: this runs the real binary through config
      # load and the store, with no key and no services. Catches the
      # init()/wiring-panic class of bug where every built binary dies while
      # go test stays green. The pipeline itself is covered by the cli tests.
      - name: Smoke test built binary
        run: |
          go build -o drsh ./cmd/drsh
          ./drsh --version
          DEEP_RESEARCH_DATA_FILE="$RUNNER_TEMP/research.jsonl" ./drsh list

      # The one-liner installers are run straight from main, unbuilt and
      # untested: a parse error in install.ps1 ("$old:" read as a drive-
      # qualified variable) broke every Windows install while CI stayed
      # green. Parsing them is their regression test.
      - name: Parse install scripts
        run: |
          sh -n scripts/install.sh
          pwsh -NoProfile -Command '$e = $null; [void][System.Management.Automation.Language.Parser]::ParseFile("scripts/install.ps1", [ref]$null, [ref]$e); if ($e) { $e | ForEach-Object { Write-Error "install.ps1:$($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }'

  # The Pi extension (integrations/pi): typecheck, unit tests, and its bridge
  # driving a drsh built from this commit with a scripted model, offline.
  pi:
    name: Pi extension
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: integrations/pi/package-lock.json
      - name: Typecheck and test
        run: make pi

  # The serve page in a browser (internal/web/browser): its live frame's
  # parity with the terminal UI, docs/surfaces.md. Required here: locally a
  # missing browser skips it.
  web:
    name: Browser tests
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: internal/web/browser/package-lock.json
      - name: Install Chromium
        working-directory: internal/web/browser
        run: npm ci --ignore-scripts --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Browser tests
        run: WEB_REQUIRED=1 make web

  lint:
    name: Lint
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache: true
      # golangci-lint runs the config in .golangci.yml, which covers
      # errcheck/govet/ineffassign/staticcheck/unused (≈ make verify's
      # golangci + ineffassign steps).
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      # The two make-verify linters not bundled with golangci.
      - name: gocyclo & deadcode
        run: |
          go install github.com/fzipp/gocyclo/cmd/gocyclo@latest
          go install golang.org/x/tools/cmd/deadcode@latest
          gocyclo -over 15 .
          # deadcode exits 0 even when it finds unreachable functions, so the
          # gate has to look at the output (same as the Makefile target).
          out=$(deadcode ./...)
          if [ -n "$out" ]; then echo "unreachable code:"; echo "$out"; exit 1; fi

  # The release builds only a commit main's CI passed: rather than run the
  # same tests a second time on the tag, it asks for a successful run of
  # this workflow on main for the tagged commit, and stops without one (main
  # not pushed, still running, failed, or the tag on another commit).
  release:
    name: Draft Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Require main's CI to have passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$GITHUB_WORKFLOW" \
            --branch main --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          if [ "$passed" -eq 0 ]; then
            echo "::error::No successful CI run on main for $GITHUB_SHA. Push the commit to main, wait for its CI to pass, then re-run this job."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # goreleaser needs full history (previous tags)
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache: true
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
