# Default config for deep-research agent
# Agent prompts are built in; an agent.yaml beside this file overrides them
# (see docs/configuration.md)
#
# Every key below can also be set from the environment as DEEP_RESEARCH_<KEY>
# (uppercase), e.g. DEEP_RESEARCH_SOURCES_PER_TOPIC=9. The environment wins
# over this file.

data_file: ~/.deep-research/research.jsonl

# Timeout for a single model call, and the deadline for a whole run. A
# streamed phase's timeout counts silence: every piece of reasoning or answer
# restarts it, and five times it caps the attempt. The run deadline covers
# searching and scraping too, which dominate wall-clock time on a wide plan,
# so it is set here rather than derived from the call timeout.
model_call_timeout: 120s
run_timeout: 30m
# Extra attempts for a failed model call; each retry doubles the call timeout,
# because a call that ran out of time usually needed more of it.
model_call_retries: 2
# How hard each phase's model reasons before answering: default (send nothing,
# the provider decides), none, minimal, low, medium, high, xhigh or max.
# Reasoning is most of a run's time. Lower levels are faster; the analysis and
# the fact-check are what the answer rests on, so they keep the provider's
# default unless you set them. A level the provider refuses is dropped for the
# rest of the run, and Claude, which cannot turn thinking off, gets low for
# none and minimal. One phase from the environment:
# DEEP_RESEARCH_REASONING_EFFORT_FACT_CHECK=medium.
reasoning_effort:
  plan: low
  clarify: low
  search: default
  analyze: default
  fact_check: default
  summarize: default
  answer: default
  chat: medium
# Sources gathered per sub-agent. Left at 0 the --mode tier decides
# (quick 3, standard 4, deep 5), which is what makes changing depth in the
# research brief change the plan. Set it to pin the budget regardless of mode.
# The old name for this key, max_depth, still works.
sources_per_topic: 0
# Sub-topics per plan. Left at 0 the planner chooses as few as the question
# needs, up to the --mode tier's count (quick 3, standard 4, deep 6). Set it
# to ask for exactly that many (at most 8) in every mode; --topics overrides.
sub_topics: 0
# The follow-up round: after the planned searches, one call names up to three
# searches for what the findings leave open, and they run before the analysis.
# false skips it (one model call and up to three searches fewer); --no-follow-ups
# skips it for one run, and f in the research brief turns it on or off.
follow_ups: true
# Clarifying questions: before planning, one call checks what the question
# leaves open that would change the research (the audience, the jurisdiction,
# the period, which product) and asks up to three questions, none for a clear
# question. auto asks in the terminal and on the serve page; off never asks.
# --clarify off skips it for one run. Runs with no one to answer (--jsonl,
# --silent, a pipe) never ask; --clarify-only prints the questions
# and --answers hands them back.
clarify: auto
# The report's shape. report_format is a preset: standard (the explanation
# organized as the question needs), brief (about 300 words, at most one table),
# detailed (about 1500 words) or table (tables first, little prose).
# report_words sets the explanation's length in words (0 = the format's),
# report_tables how much goes in tables: auto (the format's), none, some or
# many. --format, --words and --tables set them for one run, and t in the
# research brief cycles the format. The program-written answer, the
# fact-check and the citations are in every format.
report_format: standard
report_words: 0
report_tables: auto
# Sub-agents searching at the same time. A deep plan has more sub-topics than
# this, and they queue: raise it to finish a wide plan sooner, lower it when the
# search backend or a rate-limited model provider cannot take the concurrency.
parallelism: 3

# LLM provider. `drsh setup` (or `drsh login`) picks one from a list and
# stores its key; what it picks wins over the settings below, and the
# environment wins over both. Any OpenAI-compatible endpoint works
# (OpenRouter, vLLM, llama.cpp, LM Studio). The matching OPENAI_* environment
# variables override whatever is set here. Keep API keys in `drsh setup` or
# .env, not in this file.
# openai_base_url: https://openrouter.ai/api/v1
# openai_model: openrouter/free

# Or Claude: your Claude subscription through Claude Code when it is signed in
# (claude auth login), ANTHROPIC_API_KEY otherwise or once the subscription's
# usage limit is reached. docs/configuration.md#claude has the details.
# provider: claude
# claude_model: claude-opus-5-5

# Web search: `drsh setup search` and `drsh setup scraper` set the keys below
# and leave the rest of this file alone. Unset, searxng_url is "auto": public
# SearXNG instances listed on searx.space, tried in turn — every query then
# goes to a third party. Set one or more of your own instances
# (comma-separated) to keep queries local, or "off" to let the model supply
# findings from memory (all unverified).
# firecrawl_url is optional: with it each result page is scraped for its full
# text, without it the search snippet is the source. SEARXNG_URL /
# FIRECRAWL_URL override these. Running both services: docs/services.md.
# searxng_url: http://localhost:8888
# firecrawl_url: http://localhost:3002

# Bearer token for hosted Firecrawl. A self-hosted instance needs none; the
# hosted service rejects an unauthenticated scrape with 401, which shows up as
# every source degrading to "snippet only". FIRECRAWL_API_KEY overrides this.
# firecrawl_api_key:

# Hosted search instead of SearXNG: exa or tavily. Each search returns the
# pages' text too, so no scraper is needed. Every query goes to that company
# and spends its credit; it is never chosen just because a key is set.
# scraper picks the page extractor behind any engine: firecrawl (the default
# when firecrawl_url is set), exa, tavily or none. Keys: EXA_API_KEY /
# TAVILY_API_KEY, or stored by `drsh setup`, rather than here.
# docs/configuration.md has costs.
# search_engine: searxng
# scraper: firecrawl
