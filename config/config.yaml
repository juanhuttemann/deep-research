# Default config for deep-research agent
# Agent prompts are built in; an agent.yaml beside this file overrides them
# (see docs/configuration.md)
#
# Every key below can also be set from the environment as DEEP_RESEARCH_<KEY>
# (uppercase), e.g. DEEP_RESEARCH_SOURCES_PER_TOPIC=9. The environment wins
# over this file.

data_file: ~/.deep-research/research.jsonl

# Timeout for a single model call, and the deadline for a whole run. The run
# deadline covers searching and scraping too, which dominate wall-clock time
# on a wide plan, so it is set here rather than derived from the call timeout.
model_call_timeout: 120s
run_timeout: 30m
# Extra attempts for a failed model call; each retry doubles the call timeout,
# because a call that ran out of time usually needed more of it.
model_call_retries: 2
# Sources gathered per sub-agent. Left at 0 the --mode tier decides
# (quick 3, standard 4, deep 5), which is what makes changing depth in the
# research brief change the plan. Set it to pin the budget regardless of mode.
# The old name for this key, max_depth, still works.
sources_per_topic: 0
# Sub-agents searching at the same time. A deep plan has more sub-topics than
# this, and they queue: raise it to finish a wide plan sooner, lower it when the
# search backend or a rate-limited model provider cannot take the concurrency.
parallelism: 3

# LLM provider. `deep-research login` picks one from a list and stores its key;
# what it picks wins over the settings below, and the environment wins over
# both. Any OpenAI-compatible endpoint works (OpenRouter, vLLM, llama.cpp,
# LM Studio). The matching OPENAI_* environment variables override whatever is
# set here. Keep API keys in `deep-research login` or .env, not in this file.
# openai_base_url: https://openrouter.ai/api/v1
# openai_model: openrouter/free

# Or Claude: your Claude subscription through Claude Code when it is signed in
# (claude auth login), ANTHROPIC_API_KEY otherwise or once the subscription's
# usage limit is reached. docs/configuration.md#claude has the details.
# provider: claude
# claude_model: claude-opus-5-5

# Web search. Unset, searxng_url is "auto": public SearXNG instances listed on
# searx.space, tried in turn — every query then goes to a third party. Set one
# or more of your own instances (comma-separated) to keep queries local, or
# "off" to let the model supply findings from memory (all unverified).
# firecrawl_url is optional: with it each result page is scraped for its full
# text, without it the search snippet is the source. SEARXNG_URL /
# FIRECRAWL_URL override these. Running both services: docs/services.md.
# searxng_url: http://localhost:8888
# firecrawl_url: http://localhost:3002

# Bearer token for hosted Firecrawl. A self-hosted instance needs none; the
# hosted service rejects an unauthenticated scrape with 401, which shows up as
# every source degrading to "snippet only". FIRECRAWL_API_KEY overrides this.
# firecrawl_api_key:

# Hosted search instead of SearXNG: exa or tavily. Each search returns the
# pages' text too, so no scraper is needed. Every query goes to that company
# and spends its credit; it is never chosen just because a key is set.
# scraper picks the page extractor behind any engine: firecrawl (the default
# when firecrawl_url is set), exa, tavily or none. Keys: EXA_API_KEY /
# TAVILY_API_KEY, in .env rather than here. docs/configuration.md has costs.
# search_engine: searxng
# scraper: firecrawl
